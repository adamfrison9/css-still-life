<style>

  * { box-sizing: border-box; }

  body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
  }

  .frame {
    position: relative;
    background-color: gray;
    width: 500px;
    height: 500px;
    border: 1px dashed;
  }
  
  .handle {
    position: absolute;
    width: 30px;
    height: 25px;
    background-color: black;
    left: 125px;
    top: 80px;
    border-radius: 50%;
  }

  .handle-stem {
    position: absolute;
    width: 30px;
    height: 50px;
    background-color: gray;
    left: 125px;
    top: 80px;
    border-radius: 50%;
  }

  .kettle-top {
    background-color: #FF6729;
    position: absolute;
    top: 60px;
    left: 50px;
    border-radius: 100px 100px 100px 100px;
    width: 180px;
    height: 140px;
  }
  
  .stain {
    position: absolute;
    
    width: 50px;
    height: 30px;
    background-color: white;
  }

</style>


<div class="frame">
  <div class="stain"></div>
