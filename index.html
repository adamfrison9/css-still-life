<style>

  * { box-sizing: border-box; }
  
  :root {
    --test-alpha: 1;
    --cup-blue: rgba(27, 32, 51, var(--test-alpha));
    --cup-white: rgba(233, 230, 210, var(--test-alpha)); 
    --coffee-yellow: rgba(223, 196, 35, var(--test-alpha));
    --coffee-dark-yellow: rgba(201, 173, 0, var(--test-alpha));
    --coffee-red: rgba(180, 50, 40, var(--test-alpha));
    --top-gradient: #7d7a75;
    --bottom-gradient: #a4a09a;
  }

  body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
  }
  
  div {
    position: absolute;
    width: 100px;
    height: 100px;
  }
  
  .background-gradient {
    position: absolute;
    z-index: -5;
    top: 0px;
    left: 0px;
    width: 500px;
    height: 500px;
    background: linear-gradient(
      to bottom,
      var(--top-gradient),
      var(--bottom-gradient)
    );
  }

  .frame {
    position: relative;
    background-color: black;
    width: 500px;
    height: 500px;
    border: 1px dashed;
  }

  .kettle-top {
    background-color: #FF6729;
    top: 90px;
    left: 70px;
    width: 165px;
    height: 165px;
    clip-path: polygon(22% 10%, 50% 3%, 76% 10%, 92% 28%, 92% 42%, 98% 47%, 94% 59%, 85% 58%, 72% 71%, 45% 78%, 16% 72%, 0% 52%, 2% 35%, 9% 20%);
    z-index: 0;
  }
  
  .kettle-bottom {
    top: 135px;
    left: 65px;
    border-radius: 100px 100px 100px 100px;
    width: 150px;
    height: 140px;
  }
  
  .poly1{
    background-color: #945f50;
    width: 165px;
    height: 165px;
    top: 38px;
    left: 5px;
    z-index: 0;
    clip-path: polygon(0% 2%, 16% 21%, 28% 50%, 17% 37%);
  }
  
  .poly3 {
    background-color: #832608;
    width: 165px;
    height: 165px;
    top: 38px;
    left: 5px;
    z-index: 0;
    clip-path: polygon(45% 27%, 72% 20%, 70% 52%, 49% 56%);
  }
  
  .poly2 {
    background-color: #893018;
    width: 165px;
    height: 165px;
    top: 38px;
    left: 5px;
    z-index: 0;
    clip-path: polygon(16% 22%, 45% 27%, 49% 56%, 28% 50%);
  }
  
  .poly4 {
    background-color: #6d0f00;
    width: 165px;
    height: 165px;
    top: 38px;
    left: 5px;
    z-index: 0;
    clip-path: polygon(72% 20%, 85% 7%, 86% 20%, 82% 38%, 70% 52%);
  }
  
  .poly5 {
    background-color: #71250d;
    width: 165px;
    height: 165px;
    top: 38px;
    left: 5px;
    z-index: 0;
    clip-path: polygon(85% 7%, 100% 10%, 86% 18%);
  }
  
  .spout {
    background-color: gray;
    top: 147px;
    left: 202px;
    width: 52px;
    height: 52px;
    clip-path: polygon(37% 20%, 87% 59%, 82% 82%, 11% 79%);
    z-index: 1;
  }
  
  .base {
    width: 165px;
    height: 165px;
    left: 7px;
    top: 37px;
    background-color: #6a685c;
    clip-path: polygon(20% 40%, 83% 35%, 90% 53%, 91% 69%, 89% 74%, 88% 78%, 86% 82%, 83% 86%, 76% 92%, 70% 95%, 63% 98%, 54% 99%, 45% 98%, 37% 95%, 30% 91%, 23% 85%, 17% 71%, 18% 59%);
  }
  
  .ellipse-2 {
    width: 195px;
    height: 240px;
    left: 320px;
    top: 90px;
    background-color: #dfc423;
    clip-path: ellipse(40% 25% at 50% 50%);
  }
  
  .cup-container {
    left: 246px;
    top: 276px;
    overflow: hidden;
    width: 68px;
    height: 86px;
    background-color: rgba(1, 1, 1, 0.0);
  }
  
  .coffee-distort {
    position: absolute;
    left: var(--left-offset);
    top: var(--top-offset);
    perspective: var(--trans-length);
    perspective-origin: 50% 50%;
  }
  
  .coffee-1 {
    width: 145px;
    height: 300px;
    transform: rotateX(var(--x-deg)) rotateY(var(--y-deg)) rotateZ(var(--z-deg));
  }
  
  .cap {
    width: 145px;
    height: 218px;
    background-color: var(--coffee-yellow);
    clip-path: ellipse(50% 25% at 50% 50%);
    z-index: 1;
  }
  
  .cylinder {
    width: 145px;
    height: 112px;
    top: 108px;
    background-color: var(--coffee-dark-yellow);
  }
  
  .bg-fill {
    margin: auto;
    left: 17.5px;
    top: 190px;
    width: 110px;
    height: 50px;
    background-color: var(--coffee-dark-yellow)
  }
  
  .red_bit {
    width: 145px;
    height: 145px;
    clip-path: polygon(5% 34%, 11% 44%, 21% 54%, 34% 60%, 48% 62%, 62% 61%, 74% 57%, 86% 49%, 95% 39%, 100% 29%, 100% 52%, 96% 61%, 90% 69%, 80% 77%, 67% 82%, 49% 83.5%, 33% 81%, 20% 76%, 11% 69%, 5% 61%, 0% 52%, 0% 25%);
    background-color: var(--coffee-red);
    top: 145px;
    z-index: 5;
  }
  
  .coffee-text-1 {
    font-size: 25px;
    position: relative;
    top: 68px;
    z-index: 3;
    transform: skew(0deg, 45deg);
  }
  
  .coffee-text-2 {
    font-size: 25px;
    position: relative;
    top: 40px;
    z-index: 3;
    transform: skew(0deg, 45deg);
  }
  
  .cup-segment:nth-child(even) {
    background-color: var(--cup-blue);
    
  }
  
  .cup-segment:nth-child(odd) {
    background-color: var(--cup-white);
  }
  
  .new-cup-distort {
    overflow: hidden;
    position: absolute;
    z-index: 100;
    perspective: var(--trans-length);
    perspective-origin: 50% 50%;
    top: var(--top-offset);
    left: var(--left-offset);
    width: 90px;
    height: 500px;
  }
  
  .new-cup-container {
    width: 160px;
    height: 160px;
    transform-style: preserve-3d;
    transform: rotateX(var(--x-deg)) rotateY(var(--y-deg)) rotateZ(var(--z-deg));
  }
  
  .two-handles {
    position: absolute;
    top: 280px;
    left: 215px;
    width: 60px;
    height: 60px;
    background-color: #cccccc;
    clip-path: polygon(50% 3%, 59% 7%, 59% 23%, 48% 18%, 45% 24%, 49% 32%, 59% 38%, 59% 74%, 47% 63%, 42% 65%, 48% 74%, 59% 81%, 59% 94%, 53% 93%, 46% 88%, 37% 81%, 32% 71%, 30% 59%, 34% 53%, 39% 49%, 50% 50%, 59% 56%, 59% 52%, 49% 48%, 39% 42%, 34% 35%, 32% 28%, 32% 21%, 35% 10%, 42% 4%);
  }
  
  .handle {
    width: 45px;
    height: 45px;
    top: 202px;
    left: 385px;
    background-color: var(--cup-white);
  clip-path: polygon(60% 6%, 67% 5%, 74% 8%, 77% 14%, 70% 37%, 62% 65%, 58% 86%, 52% 93%, 45% 92%, 38% 85%, 42% 59%, 49% 30%);
    z-index: 200;
  }
  
  .flag-1 {
    position: absolute;
    top: 72px;
    right: 75px;
    background-color: #bb0000;
    clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
    width: 30px;
    height: 13px;
    z-index: 10;
    transform: skew(0deg, 46deg);
  }
  
  .flag-2 {
    position: absolute;
    top: 90px;
    right: 75px;
    background-color: #bb0000;
    clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
    width: 30px;
    height: 13px;
    z-index: 10;
    transform: skew(0deg, 45deg);
  }
  
  .new-cup-container > div {
    top: calc(sibling-index() * var(--segment-dist));
    width: var(--segment-width);
    height: var(--segment-height);
    z-index: calc(10 - sibling-index());
    clip-path: ellipse(50% 50% at 50% 50%);
  }
  
  .cup-hole {
    position: absolute;
    left: 3px;
    top: 10px !important;
    width: calc(var(--segment-width) - 6px) !important;
    height: calc(var(--segment-height) - 11px) !important;

    background-color: #aaaaaa;
    z-index: 130 !important;
  }
  


</style>
