<style>
  * { box-sizing: border-box; }
  
  :root {
    --test-alpha: 1;
    --cup-blue: rgba(27, 32, 51, var(--test-alpha));
    --cup-white: rgba(233, 230, 210, var(--test-alpha)); 
    --coffee-yellow: rgba(223, 196, 35, var(--test-alpha));
    --coffee-dark-yellow: rgba(201, 173, 0, var(--test-alpha));
    --coffee-red: rgba(180, 50, 40, var(--test-alpha));
    --kettle: #ff6729;
    --top-gradient: #777777;
    --bottom-gradient: #111111;
  }

  body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
  }
  
  div {
    position: absolute;
    width: 100px;
    height: 100px;
  }
  
  /* BG */
  .frame {
    background-color: black;
    border: 1px dashed;

    position: relative;
    width: 500px;
    height: 500px;
  }

  .background-gradient {
    background: linear-gradient(
      to bottom,
      var(--top-gradient),
      var(--bottom-gradient)
    );
    
    top: 0px;
    left: 0px;
    width: 500px;
    height: 500px;
  }

  .kettle-top {
    background-color: var(--kettle);
  
    z-index: 3;
    top: 90px;
    left: 70px;
    width: 165px;
    height: 165px;
  
    clip-path: polygon(22% 10%, 50% 3%, 76% 10%, 92% 28%, 92% 42%, 98% 47%, 94% 59%, 85% 58%, 72% 71%, 45% 78%, 16% 72%, 0% 52%, 2% 35%, 9% 20%);
  }
  
  .kettle-top-extension {
    background-color: var(--kettle);

    z-index: 4;
    top: 113px;
    left: 48px;
    width: 47px;
    height: 47px;
    
    clip-path: polygon(21% 20%, 37% 22%, 46% 14%, 97% 26%, 70% 93%, 27% 82%, 16% 69%, 18% 62%, 10% 41%);
  }
  
  .kettle-bottom {
    top: 135px;
    left: 65px;
    width: 150px;
    height: 140px;
  }
  
  .kettle-handle {
    background-color: black;

    left: -10px;
    top: 114px;

    clip-path: polygon(74% 9%, 71% 37%, 58% 36%, 51% 39%, 53% 45%, 55% 53%, 53% 60%, 58% 67%, 58% 75%, 65% 83%, 66% 92%, 56% 95%, 42% 94%, 35% 79%, 28% 59%, 26% 42%, 27% 28%, 33% 18%, 43% 12%, 57% 10%);
  }
  
  .kettle-gripper {
    background-color: #222222;

    z-index: 5;
    top: 110px;
    left: 124px;
    width: 40px;
    height: 40px;

    clip-path: polygon(31% 7%, 52% 4%, 73% 9%, 87% 25%, 87% 43%, 80% 75%, 63% 94%, 44% 94%, 25% 78%, 11% 44%, 12% 25%);
  }
  
  .poly1{
    background-color: #945f50;

    z-index: 3;
    top: 38px;
    left: 5px;
    width: 165px;
    height: 165px;

    clip-path: polygon(0% 2%, 16% 21%, 28% 50%, 17% 37%);
  }

  .poly2 {
    background-color: #893018;

    z-index: 3;
    top: 38px;
    left: 5px;
    width: 165px;
    height: 165px;

    clip-path: polygon(16% 22%, 45% 27%, 49% 56%, 28% 50%);
  }

  .poly3 {
    background-color: #832608;

    z-index: 3;
    top: 38px;
    left: 5px;
    width: 165px;
    height: 165px;

    clip-path: polygon(45% 27%, 72% 20%, 70% 52%, 49% 56%);
  }
  

  .poly4 {
    background-color: #6d0f00;

    z-index: 3;
    top: 38px;
    left: 5px;
    width: 165px;
    height: 165px;

    clip-path: polygon(72% 20%, 85% 7%, 86% 20%, 82% 38%, 70% 52%);
  }
  
  .poly5 {
    background-color: #71250d;

    z-index: 3;
    top: 38px;
    left: 5px;
    width: 165px;
    height: 165px;

    clip-path: polygon(85% 7%, 100% 9%, 85% 18%);
  }
  
  .spout {
    background-color: #444444;

    z-index: 1;
    top: 147px;
    left: 202px;
    width: 52px;
    height: 52px;

    clip-path: polygon(37% 26%, 87% 59%, 82% 82%, 11% 73%);
  }

  .base-ellipse {
    background-color: #453844;

    z-index: 2;
    top: 65px;
    left: 34px;
    width: 108px;
    height: 70px;

    clip-path: ellipse(50% 50% at 50% 50%);
  }
  
  .base-shape {
    background-color: #6a685c;

    z-index: 1;
    top: 37px;
    left: 7px;
    width: 165px;
    height: 165px;

    clip-path: polygon(15% 35%, 83% 35%, 89% 53%, 90% 69%, 89% 74%, 86% 82%, 83% 86%, 76% 92%, 70% 95%, 63% 98%, 54% 99%, 45% 98%, 37% 95%, 30% 91%, 23% 85%, 15% 73%, 12% 58%);
  }
  
  /* Coffee Contaienrs */
  .coffee-distort {
    perspective: var(--trans-length);
    perspective-origin: 50% 50%;

    top: var(--top-offset);
    left: var(--left-offset);
  }
  
  .coffee {
    transform: rotateX(var(--x-deg)) rotateY(var(--y-deg)) rotateZ(var(--z-deg));
    width: 145px;
    height: 300px;
  }
  
  .coffee-cap {
    background-color: var(--coffee-yellow);

    z-index: 1;
    width: 145px;
    height: 218px;

    clip-path: ellipse(50% 25% at 50% 50%);
  }
  
  .coffee-cylinder {
    background-color: var(--coffee-dark-yellow);

    top: 108px;
    width: 145px;
    height: 112px;
  }

  .coffee-fill {
    background-color: var(--coffee-dark-yellow);

    top: 190px;
    left: 17.5px;
    width: 110px;
    height: 50px;
  }
  
  .red-bit {
    background-color: var(--coffee-red);

    top: 145px;
    width: 145px;
    height: 145px;

    clip-path: polygon(5% 34%, 11% 44%, 21% 54%, 34% 60%, 48% 62%, 62% 61%, 74% 57%, 86% 49%, 95% 39%, 100% 29%, 100% 52%, 96% 61%, 90% 69%, 80% 77%, 67% 82%, 49% 83.5%, 33% 81%, 20% 76%, 11% 69%, 5% 61%, 0% 52%, 0% 25%);
  }
  
  /* Mugs */
  .cup-segment:nth-child(even) {
    background-color: var(--cup-blue);
  }
  
  .cup-segment:nth-child(odd) {
    background-color: var(--cup-white);
  }

  .cup-distort {
    perspective: var(--trans-length);
    perspective-origin: 50% 50%;

    z-index: 1;
    top: var(--top-offset);
    left: var(--left-offset);
    width: 90px;
    height: 500px;
    
    overflow: hidden;
  }
  
  .cup-container {
    transform-style: preserve-3d;
    transform: rotateX(var(--x-deg)) rotateY(var(--y-deg)) rotateZ(var(--z-deg));
    width: 160px;
    height: 160px;
  }
  
  .two-handles {
    background-color: #cccccc;

    top: 280px;
    left: 215px;
    width: 60px;
    height: 60px;

    clip-path: polygon(50% 3%, 59% 7%, 59% 23%, 48% 18%, 45% 24%, 49% 32%, 59% 38%, 59% 74%, 47% 63%, 42% 65%, 48% 74%, 59% 81%, 59% 94%, 53% 93%, 46% 88%, 37% 81%, 32% 71%, 30% 59%, 34% 53%, 39% 49%, 50% 50%, 59% 56%, 59% 52%, 49% 48%, 39% 42%, 34% 35%, 32% 28%, 32% 21%, 35% 10%, 42% 4%);
  }
  
  .handle {
    background-color: var(--cup-white);

    top: 202px;
    left: 385px;
    width: 45px;
    height: 45px;

    clip-path: polygon(60% 6%, 67% 5%, 74% 8%, 77% 14%, 70% 37%, 62% 65%, 58% 86%, 52% 93%, 45% 92%, 38% 85%, 42% 59%, 49% 30%);
    z-index: 200;
  }
  
  .flag-1 {
    background-color: #bb0000;

    top: 72px;
    right: 75px;
    width: 30px;
    height: 13px;
    transform: skew(0deg, 46deg);

    clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
  }
  
  .flag-2 {
    background-color: #bb0000;

    top: 90px;
    right: 75px;
    width: 30px;
    height: 13px;
    transform: skew(0deg, 45deg);

    clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
  }
  
  .cup-container > div {
    z-index: calc(10 - sibling-index());
    top: calc(sibling-index() * var(--segment-dist));
    width: var(--segment-width);
    height: var(--segment-height);

    clip-path: ellipse(50% 50% at 50% 50%);
  }
  
  .cup-hole {
    background-color: #aaaaaa;

    z-index: 11 !important;
    top: 10px !important;
    left: 3px;
    width: calc(var(--segment-width) - 6px) !important;
    height: calc(var(--segment-height) - 11px) !important;
  }
</style>
